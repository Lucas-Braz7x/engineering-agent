project:
  name: engineering-agent-system

language:
  name: python
  version: "3.11"

framework:
  name: typer

package_manager:
  name: pip

testing:
  command: pytest

build:
  command: pip install -e ".[dev]"

limits:
  max_iterations: 5
  max_command_execution: 20
  max_agent_calls: 30

integrations:
  github:
    remote: origin
  docker:
    compose_file: docker-compose.yml
  ci:
    provider: github_actions
